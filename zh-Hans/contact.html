<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 地图收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #666;
        }
        .contact-button {
            display: inline-block;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        .contact-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
<style>.lang-nav{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:flex-end;font-size:.85rem;margin-bottom:16px}.lang-nav a{color:#667eea;text-decoration:none}.lang-nav span{color:#999;font-weight:600}</style>
<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('.lang-nav a');if(a){try{sessionStorage.setItem('langChosen','1')}catch(_){}}});</script>
</head>
<body>
    <div class="container">
        <!--LANG-NAV--><nav class="lang-nav"><a href="../contact.html" hreflang="ja" lang="ja">日本語</a><a href="../en/contact.html" hreflang="en" lang="en">English</a><span>简体中文</span><a href="../zh-Hant/contact.html" hreflang="zh-Hant" lang="zh-Hant">繁體中文</a><a href="../es/contact.html" hreflang="es" lang="es">Español</a><a href="../ko/contact.html" hreflang="ko" lang="ko">한국어</a></nav><!--/LANG-NAV-->
        <h1>📧 联系我们</h1>
        <p>如有任何疑问或建议，欢迎随时通过以下表单与我们联系。</p>
        <p>表单页面为日文，但您可以直接用中文填写留言。</p>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeXgNw84cu3msJnUcyPNOIiTQUilJGwW0l6ch7enYY4cn267A/viewform?usp=dialog" class="contact-button" target="_blank">前往联系表单</a>

        <div>
            <a href="index.html" class="back-link">← 返回首页</a>
        </div>

        <footer>
            <p>&copy; 2026 地图收藏. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
